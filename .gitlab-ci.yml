# Пайплайн для GitLab Runner, который стоит на том же сервере, где живёт приложение.
# Все шаги идут через Docker, поэтому Node.js на сервере ставить не нужно, а SSH-ключи не нужны вовсе:
# джоба выполняется прямо на сервере.
#
# Подходит executor shell (image ниже игнорируется) и docker (с пробросом /var/run/docker.sock).
# Пользователь gitlab-runner должен иметь доступ к Docker: sudo usermod -aG docker gitlab-runner

stages:
  - build
  - test
  - deploy

variables:
  # Временный образ со стадией build из Dockerfile: в нём есть зависимости для тестов и линтера
  CI_IMAGE: wellness-shop-ci:$CI_PIPELINE_ID

default:
  image: docker:27-cli
  # Все джобы идут только на раннер нашего сервера. Этот же тег нужно добавить самому раннеру:
  # Settings -> CI/CD -> Runners -> Edit -> Tags
  tags:
    - shop-deploy

build:
  stage: build
  script:
    - docker build --target build -t "$CI_IMAGE" .

lint:
  stage: test
  script:
    - docker run --rm "$CI_IMAGE" npm run lint:check

unit-tests:
  stage: test
  script:
    - docker run --rm "$CI_IMAGE" npm test

# Деплой только из основной ветки. Настоящий .env берётся из переменной GitLab ENV_FILE
# (Settings -> CI/CD -> Variables, тип File): секреты не лежат ни в репозитории, ни на сервере
deploy:
  stage: deploy
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  environment: production
  script:
    - cp "$ENV_FILE" .env
    - docker compose -p wellness-shop up -d --build
    - docker compose -p wellness-shop ps
  after_script:
    - docker image rm "$CI_IMAGE" || true
    - docker image prune -f
